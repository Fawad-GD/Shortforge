services:
  engine:
    build: .
    env_file: .env
    # Bound to localhost on purpose: the tunnel / Caddy containers reach it over the
    # Docker network, and nothing else on the internet can talk to it directly.
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["shortforge-data:/data/storage", "whisper-cache:/root/.cache"]
    restart: unless-stopped
    # GPU (optional): install NVIDIA Container Toolkit and uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # Free public HTTPS address for a server at home (no account needed).
  #   docker compose --profile tunnel up -d ; docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://engine:8000
    depends_on: [engine]
    restart: unless-stopped

  # Automatic HTTPS for a server with a public IP (used by the Google Cloud setup).
  # Needs DOMAIN=<name pointing at this machine> in .env.
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to engine:8000
    ports: ["80:80", "443:443"]
    volumes: ["caddy-data:/data"]
    depends_on: [engine]
    restart: unless-stopped

  # Optional free local AI for better clip picking:
  #   docker compose --profile ollama up -d && docker compose exec ollama ollama pull qwen2.5:3b
  #   then set OLLAMA_HOST=http://ollama:11434 and CLIPIFY_OLLAMA_MODEL=qwen2.5:3b in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

volumes:
  shortforge-data:
  whisper-cache:
  ollama:
  caddy-data:
